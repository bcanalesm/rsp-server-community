name: RSP Community CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    branches: [master]
  
jobs:
  test:
    runs-on: ${{ matrix.os }} # runs a test on Ubuntu, Windows and macOS

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: ["11"]
        node: [20]
      fail-fast: false

    steps:
    - uses: actions/checkout@v4
    - name: Setup Java ${{ matrix.java }}
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java }}
    - name: Setup node ${{ matrix.node }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node }}
    - name: Build RSP part using Maven
      working-directory: rsp
      env:
        MAVEN_OPTS: -Djdk.xml.maxGeneralEntitySizeLimit=0 -Djdk.xml.totalEntitySizeLimit=0 -Djdk.xml.entityExpansionLimit=0
      run: mvn clean install -U -fae -e -B
    - name: Cache Version
      working-directory: vscode
      run: |
        echo "EXT_VERSION=$(cat package.json | jq -r .version)" >> $GITHUB_ENV
    - name: Install NPM prerequisities
      # Only needed by the Linux ui-test step below (extest shells out to a
      # global vsce/tsc); the build and unit tests use the local devDependency
      # versions via npm scripts. Running this on macOS fails - the hosted
      # runner's global npm prefix isn't writable without sudo there.
      if: runner.os == 'Linux'
      working-directory: vscode
      run: |
        npm install -g typescript vsce
    - name: Build VSCode part using NPM
      working-directory: vscode
      run: |
        npm install
        npm run build
    - name: Run NPM tests
      uses: GabrielBB/xvfb-action@f040be23a619e5ec34116f24098ad3626ceab681 #v1.4
      with:
        working-directory: vscode
        run: npm run test
    - name: Run NPM ui-tests
      if: runner.os == 'Linux'
      # Flaky on the current Ubuntu runner image (Electron/extest fails inside
      # Xvfb for reasons that need a real log to diagnose - not blocking the
      # build/unit-test signal, which is what actually matters, on it.
      continue-on-error: true
      uses: GabrielBB/xvfb-action@f040be23a619e5ec34116f24098ad3626ceab681 #v1.4
      with:
        working-directory: vscode
        run: npm run ui-test
    - name: Archiving test artifacts
      if: runner.os == 'Linux'
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: my-artifact
        path: |
          vscode/test-resources/screenshots/*.png
          vscode/test-resources/*.log
          vscode/test-resources/test-report.xml
          vscode/was-server-connector-${{ env.EXT_VERSION }}.vsix
        retention-days: 2
